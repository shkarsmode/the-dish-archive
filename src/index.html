<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <script>
        // Apply the saved theme before first paint, so dark mode never flashes white.
        (function () {
            try {
                var t = localStorage.getItem('dish-archive-theme');
                if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* storage blocked: default light */ }
        })();
    </script>
    <title>The Dish Archive — Колекція рецептів</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Колекція улюблених рецептів та страв, зібрана з турботою.">
    <meta name="theme-color" content="#FAFAF7">
    <!-- Default social/SEO tags for the site shell. Per-recipe pages (/dish/:slug)
         are re-rendered server-side (see api/render.js) with recipe-specific
         Open Graph / Twitter / JSON-LD; the client SeoService keeps them in sync
         during in-app navigation. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Dish Archive">
    <meta property="og:locale" content="uk_UA">
    <meta property="og:title" content="The Dish Archive — Колекція рецептів">
    <meta property="og:description" content="Колекція улюблених рецептів та страв, зібрана з турботою.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="The Dish Archive — Колекція рецептів">
    <meta name="twitter:description" content="Колекція улюблених рецептів та страв, зібрана з турботою.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Warm the Cloudinary connection so the LCP hero/card images skip cold DNS+TLS -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Icon font subset: only the glyphs the app uses (~65 KB instead of ~4 MB).
         Adding a new icon? Append its name here (sorted), or it renders as plain text. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..600,0..1,0&icon_names=account_circle,add,add_a_photo,add_circle,add_photo_alternate,admin_panel_settings,arrow_back,arrow_forward,aspect_ratio,auto_awesome,bolt,bookmark,build,cancel,casino,celebration,chat_bubble,check,check_box,check_box_outline_blank,check_circle,chevron_left,chevron_right,circle,close,cloud_done,cloud_upload,compare_arrows,content_paste,crop,dark_mode,dashboard,delete,diversity_3,download,edit,edit_note,error,expand_more,favorite,favorite_border,flip,format_list_bulleted_add,format_list_numbered,grid_view,grocery,group,help,history,history_edu,hourglass_top,how_to_reg,image,image_not_supported,inbox,info,insights,language,light_mode,lightbulb,link,list_alt,local_fire_department,lock,lock_open,logout,manage_accounts,mic,notifications_active,open_in_new,pause,payments,pending,person_add,person_remove,photo_camera,photo_library,play_arrow,progress_activity,public,radio_button_unchecked,refresh,remove_circle,replay,restart_alt,restaurant,rotate_left,rotate_right,schedule,search,search_off,settings,share,shield_person,skillet,sort,star,star_border,star_half,sticky_note_2,stop,task_alt,transform,trending_up,tune,undo,view_agenda,view_comfy,warning&display=block" rel="stylesheet">
</head>
<body>
    <!-- Preloader -->
    <div id="app-preloader" class="preloader">
        <div class="preloader-content">
            <div class="preloader-logo">
                <span class="preloader-icon">🍽</span>
                <h1 class="preloader-title">The Dish Archive</h1>
                <div class="preloader-line"></div>
            </div>
        </div>
    </div>
    <style>
        .preloader {
            position: fixed;
            inset: 0;
            z-index: 9999999 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FAFAF7;
            color: #1C1C1C;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.35s;
        }
        .preloader.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        /* Keep the app hidden behind the preloader until it's ready (avoids FOUC) */
        .preloader ~ app-root {
            visibility: hidden;
        }
        .preloader.fade-out ~ app-root {
            visibility: visible;
        }
        .preloader-content {
            text-align: center;
            animation: preloaderFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .preloader-icon {
            display: block;
            font-size: 40px;
            margin-bottom: 16px;
            animation: preloaderFloat 2s ease-in-out infinite;
        }
        .preloader-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: inherit;
            letter-spacing: -0.02em;
            margin: 0;
        }
        [data-theme='dark'] .preloader { background: #1A1A1A; color: #F0EDE8; }
        [data-theme='dark'] body { background: #1A1A1A; }
        .preloader-line {
            width: 48px;
            height: 2px;
            margin: 20px auto 0;
            background: linear-gradient(90deg, transparent, #B8926A, transparent);
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }
        .preloader-line::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, #B8926A 50%, transparent 100%);
            animation: preloaderShimmer 1.4s ease-in-out infinite;
        }
        @keyframes preloaderFadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes preloaderFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes preloaderShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
    <app-root></app-root>
    <script>
        // The app calls __hidePreloader() once the first page has rendered (first
        // NavigationEnd), so the splash never gives way to a blank screen. The timer is
        // only a safety net in case the app fails to start.
        (function () {
            var start = Date.now();
            var done = false;
            window.__hidePreloader = function () {
                if (done) return;
                done = true;
                var wait = Math.max(0, 250 - (Date.now() - start));
                setTimeout(function () {
                    var preloader = document.getElementById('app-preloader');
                    if (!preloader) return;
                    preloader.classList.add('fade-out');
                    setTimeout(function () { preloader.remove(); }, 350);
                }, wait);
            };
            setTimeout(window.__hidePreloader, 8000);
        })();
    </script>
</body>
</html>
